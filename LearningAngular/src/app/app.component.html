<app-header/>

<main>
  <ul id="users">

    @for (obj of users; track obj.id) {
      <li>
        <app-user [user]="obj"
                  (select)="onSelectUser($event)"
        />
      </li>
    }
  </ul>

  @if (selectedUser) {
    <app-task [name]="selectedUser.name"></app-task>
  } @else {
    <p id="fallback">Select a user</p>
  }
</main>
